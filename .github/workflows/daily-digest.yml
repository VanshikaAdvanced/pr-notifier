name: Daily PR digest

on:
  schedule:
    # Morning: 09:00 India time (IST, no clock change) = 03:30 UTC, Mon-Fri.
    - cron: '30 3 * * 1-5'
    # Evening: 17:00 UK time is 16:00 UTC in summer (BST) and 17:00 UTC in winter (GMT).
    # Both are scheduled; the script only posts for the one that is 5pm in London.
    - cron: '0 16 * * 1-5'
    - cron: '0 17 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/daily-digest.js
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPOS: ${{ vars.REPOS }}
          STALE_DAYS: ${{ vars.STALE_DAYS || '5' }}
          DIGEST_SCHEDULE: ${{ github.event.schedule }}
