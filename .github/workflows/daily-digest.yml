name: Daily PR digest

on:
  schedule:
    # Cron is UTC. 04:00 UTC, Mon-Fri. Adjust to your team's morning.
    - cron: '0 4 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/daily-digest.js
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          REPOS: ${{ vars.REPOS }}
          STALE_DAYS: ${{ vars.STALE_DAYS || '5' }}
