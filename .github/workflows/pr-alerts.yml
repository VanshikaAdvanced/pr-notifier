name: PR alerts to Teams

on:
  schedule:
    # UTC, weekdays 07:00-16:50 = 8am-5:50pm UK in summer (BST), 7am-4:50pm in winter (GMT).
    # Limited hours keep private-repo usage (~1,300 min/month) under the 2,000 free minutes.
    - cron: '*/10 7-16 * * 1-5'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pr-alerts
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node src/notify-poll.js
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOS: ${{ vars.REPOS }}
          WORKFLOW_FILE: pr-alerts.yml
